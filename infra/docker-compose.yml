name: agent-crash-lab

# 실행: 루트에서 `make up` 또는
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
# 모든 앱 서비스는 GET /health 를 제공해야 한다.

services:
  postgres:
    build: ./postgres
    image: agent-crash-lab-postgres-vector:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD}
      HARNESS_DB_PASSWORD: ${HARNESS_DB_PASSWORD}
      ORACLE_DB_PASSWORD: ${ORACLE_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  knowledge:
    build:
      context: ..
      dockerfile: knowledge/Dockerfile
    environment:
      KNOWLEDGE_DATABASE_URL: postgresql://harness_app:${HARNESS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in the root .env before starting services}
      MODEL_DIR: /models
      CORPUS_MANIFEST: /project/qa/knowledge/corpus.json
      CORPUS_RAW_DIR: /data/raw
      EMBEDDING_THREADS: 2
    volumes:
      - knowledge_models:/models
      - ../qa:/project/qa:ro
      - ../artifacts/local-runs/knowledge/raw:/data/raw:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 180s

  mcp-server:
    build: ../mcp-server
    environment:
      SERVER_PORT: 8081
      KNOWLEDGE_URL: http://knowledge:8010
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: mcp_app
      SPRING_DATASOURCE_PASSWORD: ${MCP_DB_PASSWORD}
      # 서비스 간 공유 토큰. 누락 시 시작 전에 설정 오류를 알린다.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in the root .env before starting services}
      # Agent 재개·이벤트 제출 등 MCP → Harness 호출 (MCP_SPEC 4장). depends_on은 순환이 생기므로 두지 않는다
      HARNESS_URL: http://harness:8000
      MCP_PUBLIC_URL: http://mcp-server:8081/mcp
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-crashlab}
    ports:
      - "${MCP_SERVER_PORT:-8081}:8081"
    volumes:
      - ../qa:/qa:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  agents:
    build: ../agents
    environment:
      MCP_URL: http://mcp-server:8081/mcp
      SIMULATION_CALLBACK_BASE: ${SIMULATION_CALLBACK_BASE:-http://harness:8000}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-}
      AGENT_MODEL_MODE: ${AGENT_MODEL_MODE:-offline}
      PURCHASE_LLM_MODEL: ${PURCHASE_LLM_MODEL:-}
      INVESTIGATION_LLM_MODEL: ${INVESTIGATION_LLM_MODEL:-}
      QA_DESIGN_MODEL_MODE: ${QA_DESIGN_MODEL_MODE:-offline}
      QA_DESIGN_LLM_MODEL: ${QA_DESIGN_LLM_MODEL:-}
      QA_REVIEW_LLM_MODEL: ${QA_REVIEW_LLM_MODEL:-}
      LLM_BUDGET_STAGE: ${LLM_BUDGET_STAGE:-smoke}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in the root .env before starting services}
      AGENT_PROJECT_ROOT: /project
      AGENT_STATE_DIR: /state
    volumes:
      - agent_state:/state
      - ../config:/project/config:ro
      - ../qa:/project/qa:ro
    ports:
      - "${AGENTS_PORT:-8090}:8090"
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  harness:
    build: ../harness
    environment:
      DATABASE_URL: postgresql://harness_app:${HARNESS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ORACLE_DATABASE_URL: postgresql://oracle_ro:${ORACLE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MCP_URL: http://mcp-server:8081
      AGENT_URL: http://agents:8090
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in the root .env before starting services}
      HARNESS_PROJECT_ROOT: /project
      HARNESS_DEV_AUTH: ${HARNESS_DEV_AUTH:-false}
      EXTERNAL_AGENT_ENDPOINTS: ${EXTERNAL_AGENT_ENDPOINTS:-{}}
      SIMULATION_CALLBACK_BASE: ${SIMULATION_CALLBACK_BASE:-http://harness:8000}
    ports:
      - "${HARNESS_PORT:-8000}:8000"
    volumes:
      - ../config:/project/config:ro
      - ../qa:/project/qa:ro
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
      agents:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ../frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - harness

volumes:
  pgdata:
  agent_state:

  knowledge_models:
