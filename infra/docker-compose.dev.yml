# Local development environment. Select services with the dev Make targets.
# Requires Docker Compose >= 2.24.4 for !reset / !override.
name: agent-crash-lab-dev

services:
  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  mcp-server:
    ports: !override
      - "127.0.0.1:${MCP_SERVER_PORT:-8081}:8081"

  agents:
    environment:
      LLM_BUDGET_PATH: /experiment/llm-budget.sqlite
    volumes:
      - ../artifacts/local-runs/model-experiment/state:/experiment
    depends_on: !reset {}
    ports: !override
      - "127.0.0.1:${AGENTS_PORT:-8090}:8090"

  harness:
    ports: !override
      - "127.0.0.1:${HARNESS_PORT:-8000}:8000"

  frontend:
    depends_on: !reset {}
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
